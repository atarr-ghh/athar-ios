const enc=new TextEncoder(),dec=new TextDecoder();function b64(a){let s='';for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}function un64(s){return Uint8Array.from(atob(s),x=>x.charCodeAt(0))}async function deriveVault(pass,salt){let b=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:180000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}async function encryptVault(data,k,salt){let iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(data)));return {salt:b64(salt),iv:b64(iv),data:b64(new Uint8Array(ct))}}async function unlockVault(f){if(!globalThis.crypto?.subtle)return notify('التشفير غير متاح في هذه البيئة. افتحي التطبيق في متصفح يدعم Web Crypto.');let p=new FormData(f).get('pass');if(p.length<8)return notify('اختاري كلمة مرور من 8 أحرف على الأقل');try{let existing=store.vault?.data,salt=existing?un64(store.vault.salt):crypto.getRandomValues(new Uint8Array(16)),k=await deriveVault(p,salt);let plain=existing?JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(store.vault.iv)},k,un64(store.vault.data)))):{};if(!existing){store.vault=await encryptVault(plain,k,salt);if(!save())return}vaultKey=k;vaultPlain=plain;vaultUnlocked=true;render()}catch(e){notify('كلمة المرور غير صحيحة أو الملف تالف')}}function lockVault(){vaultKey=null;vaultPlain={};vaultUnlocked=false;render()}async function writeVault(data){if(!vaultUnlocked||!vaultKey)return;try{store.vault=await encryptVault(data,vaultKey,un64(store.vault.salt));vaultPlain=data;commit('تم حفظ السجل مشفرًا')}catch(e){notify('تعذر تشفير السجل')}}function privatePage(id){if(!globalThis.crypto?.subtle)return '<div class="card"><h3>المساحة الخاصة غير متاحة</h3><p>هذا المتصفح لا يدعم التشفير في بيئة فتح الملف الحالية. لا تُكتَب بياناتك الحساسة هنا.</p></div>';if(!vaultUnlocked)return `<div cl function booksPage(id){let a=list(id),e=a.find(x=>x.id===editID)||{};return `<div class="card"><div class="grid"><div class="stat"><b>${a.filter(x=>Number(x.read)>=Number(x.pages)).length}</b><small>كتب مكتملة</small></div><div class="stat"><b>${fmt(a.reduce((s,x)=>s+Number(x.read),0))}</b><small>صفحات مقروءة مسجلة</small></div></div>${a.map(x=>`<div class="entry"><h3>${esc(x.title)}</h3><span class="sub">${esc(x.author)} · ${fmt(x.read)} / ${fmt(x.pages)} صفحة</span>${progress(100*x.read/x.pages)}<div class="row" style="margin-top:8px">${tiny('+ صفحة',`bookAdd('${id}','${x.id}',1)`)}${tiny('+ 10 صفحات',`bookAdd('${id}','${x.id}',10)`)}${tiny('تعديل',`editID='${x.id}';render()`)}${tiny('حذف',`removeEntry('${id}','${x.id}')`,'danger')}</div>${x.note?`<p>${esc(x.note)}</p>`:''}</div>`).join('')||empty('مكتبتك بانتظار أول كتاب.')}</div><div class="card"><h3>${e.id?'تعديل الكتاب':'إضافة كتاب'}</h3><form class="fields" onsubmit="event.preventDefault();saveBook('${id}',this)">${field('اسم الكتاب','title','text',e.title,'required')}${field('المؤلف','author','text',e.author)}<div class="inline2">${field('عدد الصفحات','pages','number',e.pages,'min="1" required')}${field('الصفحات المقروءة','read','number',e.read||0,'min="0" required')}</div>${area('اقتباسات / ملاحظات','note',e.note)}<button class="btn">حفظ الكتاب</button></form></div>`}function saveBook(id,f){let d=formData(f);if(+d.read>+d.pages)return notify('الصفحات المقروءة تتجاوز عدد الصفحات');setList(id,[...list(id).filter(x=>x.id!==editID),{...d,id:editID||uid(),pages:+d.pages,read:+d.read}]);editID=null;commit()}function bookAdd(id,b,n){setList(id,list(id).map(x=>x.id===b?{...x,read:Math.min(+x.pages,+x.read+n)}:x));commit()}
let wheelMinutes=30,spinning=false;const wheelColors=['#d8b4c3','#c7b7db','#e5c9b3','#b9c8b5','#b7c7db','#e4d5b9'];function wheelSVG(){let a=store.hobbies,n=a.length,rad=135,c=160,deg=360/n;let slices=a.map((h,i)=>{let start=(i*deg-deg/2-90)*Math.PI/180,end=((i+1)*deg-deg/2-90)*Math.PI/180,m=(i*deg-90)*Math.PI/180;return `<path d="M ${c} ${c} L ${c+rad*Math.cos(start)} ${c+rad*Math.sin(start)} A ${rad} ${rad} 0 ${deg>180?1:0} 1 ${c+rad*Math.cos(end)} ${c+rad*Math.sin(end)} Z" fill="${wheelColors[i%wheelColors.length]}" stroke="#fff9fc" stroke-width="2"/><text x="${c+91*Math.cos(m)}" y="${c+91*Math.sin(m)}" font-size="${n>8?10:12}" text-anchor="middle" dominant-baseline="middle" fill="#4c3a4a" font-weight="600" transform="rotate(${i*deg>90&&i*deg<270?i*deg+180:i*deg} ${c+91*Math.cos(m)} ${c+91*Math.sin(m)})">${esc(h.name.length>16?h.name.slice(0,15)+'…':h.name)}</text>`}).join('');return `<div class="wheelwrap"><div class="wheelpointer"></div><svg viewBox="0 0 320 320" aria-label="عجلة الهوايات"><g class="wheelinner" id="wheelInner" style="transform:rotate(${wheelAngle}deg)">${slices}</g><circle cx="160" cy="160" r="135" stroke="#b89aaa" fill="none" stroke-width="2"/><circle cx="160" cy="160" r="33" fill="#fff8fa" stroke="white" stroke-width="3"/><text x="160" y="166" text-anchor="middle" font-size="24" fill="#8e6681">✧</text></svg></div>`}function wheelPage(){let c=activeChallenge;return `<div class="card"><div class="row between"><h3>وقت فراغك</h3><span class="tag">تحديات قابلة للتعديل</span></div><div class="toolbar" style="margin:9px 0">${[5,15,30,60].map(n=>`<button class="chip ${wheelMinutes===n?'on':''}" onclick="wheelMinutes=${n};render()">${n} دقيقة</button>`).join('')}</div>${wheelSVG()}<button id="spinBtn" class="btn wide" onclick="spinWheel()" ${spinning?'disabled':''}>${spinning?'العجلة تدور…':'✧ دوّري عجلة الإبداع'}</button><div id="challengeResult">${c?challengeResult(c):''}</div></div><div class="card"><h3>هواياتي وتحدياتي</h3>${store.hobbies.map((h,i function makeChoiceChallenge(name,wheelName){let aliases={'photography':'تصوير','photo':'تصوير','تصوير فوتوغرافي':'تصوير','drawing':'رسم','painting':'رسم','writing':'كتابه','reading':'قراءه','crafts':'اشغال يدويه','discovery':'اكتشاف'};let k=hobbyKey13(name);k=aliases[k]||k;let h=store.hobbies.find(x=>hobbyKey13(x.name)===k)||baseHobbies.find(x=>hobbyKey13(x.name)===k);if(!h&&!/هواي|hobb/i.test(wheelName||''))return null;let tasks=h?.tasks?.filter(Boolean)||[];if(!tasks.length)tasks=[bi('خصصي وقتًا لممارسة '+name+' وجربي فكرة جديدة، ثم سجلي نتيجتك.','Spend some time on '+name+', try a new idea, and record your result.')];return {id:uid(),hobby:h?.name||name,task:tasks[Math.floor(Math.random()*tasks.length)],minutes:wheelMinutes,date:selected,status:'مقترح'}}
function acceptChoiceChallenge(){if(!choiceChallenge)return;activeChallenge=choiceChallenge;choiceChallenge=null;choiceResult='';acceptChallenge()}
function challengeResult(c,action='acceptChallenge()'){return `<div class="entry" style="margin-top:15px"><span class="tag">تحديك · ${c.minutes} دقيقة</span><h3 style="margin-top:8px">${esc(c.hobby)}</h3><p>${esc(c.task)}</p>${c.hobby==='التصوير'?'<p><a href="https://www.pinterest.com/search/pins/?q=coffee%20book%20aesthetic%20photography">ابحثي عن صورة مرجعية في Pinterest ↗</a></p>':''}<button class="btn wide" onclick="${action}">${bi('قبول التحدي','Accept challenge')}</button></div>`}function acceptChallenge(){if(!activeChallenge)return;store.challenges.push({...activeChallenge,status:'قيد التنفيذ'});activeChallenge=null;save();go('sub','hobbies','gallery');notify('التحدي في معرضك')}function addHobby(f){let d=formData(f);if(store.hobbies.length>=12)return notify('حد العجلة 12 هواية');if(store.hobbies.some(x=>x.name===d.name.trim()))return notify('الهواية موجودة');store.hobbies.push({name:d.name.trim(),tasks:[d.task.trim()]});commit()}function addTask(i,f){let t=new FormData(f).get('task').trim();if(t){store.hobbies[i].tasks.push(t);commit()}}function removeHobby(i){if(store.hobbies.length<=2)return notify('اتركي هوايتين على الأقل');if(confirm('حذف الهواية من العجلة؟')){store.hobbies.splice(i,1);commit()}}
const rubric=['الإضاءة / الوضوح','التكوين / الأسلوب','تناسق العناصر','تحقيق تفاصيل التحدي','النتيجة والإبداع'];function galleryPage(){return `<div class="notice">تقييم النسخة الأولى ذاتي من 10. التقييم الآلي للصور يحتاج خدمة ذكاء اصطناعي خارجية غير متصلة الآن. يمكنك مقارنة الصور وإدخال تقييم تحصلين عليه هنا أو في محادثة ChatGPT.</div>${store.challenges.slice().reverse().map(c=>`<div class="card"><div class="row between"><h3>${esc(c.hobby)}</h3><span class="tag">${esc(c.status)}</span></div><p>${esc(c.task)}</p><span class="sub">${esc(c.date)} · ${c.minutes} دقيقة</span><div class="grid" style="margin-top:12px"><div><span class="sub">الصورة المرجعية</span>${c.ref?`<img class="thumb" src="${esc(c.ref)}" alt="المرجع">`:empty('لم تُضف صورة')}</div><div><span class="sub">نتيجتي</span>${c.photo?`<img class="thumb" src="${esc(c.photo)}" alt="نتيجتي">`:empty('لم تُضف صورة')}</div></div><form class="fields" onsubmit="event.preventDefault();saveChallenge('${c.id}',this)"><label>إضافة الصورة المرجعية<input type="file" name="ref" accept="image/*"></label><label>إضافة صورة عملي<input type="file" name="photo" accept="image/*"></label><div class="fields">${rubric.map((r,i)=>field(r+' (0–2)','r'+i,'number',c.scores?.[i]??'','min="0" max="2" step="0.5"')).join('')}</div>${area('ملاحظات التقييم / نتيجة تحدي الكتابة','note',c.note)}${select('الحالة','status',['قيد التنفيذ','تم'],c.status)}<button class="btn">حفظ النتيجة</button></form><div class="row between" style="margin-top:12px"><b>التقييم: ${c.scores?fmt(c.scores.reduce((a,b)=>a+b,0))+' / 10':'—'}</b>${tiny('حذف',`deleteChallenge('${c.id}')`,'danger')}</div><button class="btn ghost wide" style="margin-top:8px" onclick="copyPrompt('${c.id}')">نسخ طلب تقييم بالذكاء الاصطناعي</button></div>`).join('')||`<div class="card">${empty('لا توجد تحديات بعد. دوّري العجلة واختاري أول تحدٍ.')}${btn('عجلة الإبداع',"go('sub','hobbies','wheel')")}</div>`}`}
async function saveChallenge(id,f){let c=store.challenges.find(x=>x.id===id),d=formData(f);if(!c)return;try{let r=d.ref?.size?await imageData(d.ref):c.ref,p=d.photo?.size?await imageData(d.photo):c.photo;let all=rubric.every((_,i)=>d['r'+i]!=='');if(all&&rubric.some((_,i)=>+d['r'+i]<0||+d['r'+i]>2))return notify('كل معيار بين صفر ودرجتين');Object.assign(c,{ref:r,photo:p,note:d.note,status:d.status,scores:all?rubric.map((_,i)=>+d['r'+i]):c.scores});commit('تم حفظ التحدي')}catch(e){notify('تعذر قراءة إحدى الصور')}}function deleteChallenge(id){if(confirm('حذف التحدي والصور؟')){store.challenges=store.challenges.filter(x=>x.id!==id);commit()}}async function copyPrompt(id){let c=store.challenges.find(x=>x.id===id);let t=`قيّم عملي في تحدي ${c.hobby} من 10. التحدي: ${c.task}، سأرفق المرجع وعملي. قيّم كل معيار من 2: ${rubric.join('، ')}. اذكر نقاط القوة والتحسينات بوضوح.`;try{await navigator.clipboard.writeText(t);notify('تم نسخ الطلب، أرفقي الصور في ChatGPT')}catch(e){prompt('انسخي طلب التقييم:',t)}}
function goalPage(id){let a=store.goals[id]||[],e=a.find(x=>x.id===editID)||{};return `<div class="card"><h3>خطوات نحو أهدافي</h3>${a.map(g=>{let n=g.steps.filter(s=>s.done).length;return `<div class="entry"><div class="row between"><b>${esc(g.title)}</b><span class="tag">${g.steps.length?round(n/g.steps.length*100):0}%</span></div><span class="sub">${g.date?esc(g.date):'دون موعد نهائي'}</span>${progress(g.steps.length?n/g.steps.length*100:0)}${g.steps.map((s,i)=>`<div class="item"><label><input type="checkbox" ${s.done?'checked':''} onchange="toggleStep('${id}','${g.id}',${i})"><span class="${s.done?'done':''}">${esc(s.text)}</span></label></div>`).join('')}<p>${esc(g.note)}</p><div class="actions">${tiny('تعديل',`editID='${g.id}';render()`)}${tiny('حذف',`deleteGoal('${id}','${g.id}')`,'danger')}</div></div>`}).join('')||empty('أضيفي هدفًا واحدًا وخطوات صغيرة نحوه.')}</div><div class="card"><h3>${e.id?'تعديل الهدف':'من أمنية إلى واقع'}</h3><form class="fields" onsubmit="event.preventDefault();saveGoal('${id}',this)">${field('هدفي','title','text',e.title,'required')}${field('الموعد المستهدف','date','date',e.date)}${area('خطوات قابلة للإنجاز (كل خطوة بسطر)','steps',e.steps?.map(s=>s.text).join('\n')||'')}${area('لماذا أريد تحقيقه؟','note',e.note)}<button class="btn">حفظ الهدف</button></form><div class="notice">اقتراح للتقسيم: حددي نتيجة واضحة، خطوة صغيرة هذا الأسبوع، موعدًا للمراجعة، ثم تابعي ما تم. التقسيم الذكي التلقائي غير متصل في هذه النسخة.</div></div>`}function saveGoal(id,f){let d=formData(f),a=store.goals[id]||[],old=a.find(x=>x.id===editID);let steps=d.steps.split('\n').map(t=>t.trim()).filter(Boolean).map(t=>({text:t,done:old?.steps.find(x=>x.text===t)?.done||false}));store.goals[id]=[...a.filter(x=>x.id!==editID),{id:editID||uid(),title:d.title,date:d.date,note:d.note,steps}];editID=null;commit()}function toggleStep(id,g,i){let e=store.goals[id].find(x=>x.id===g);e.steps[i].done=!e.steps[i].done;commit()}function deleteGoal(id,g){if(confirm('حذف الهدف؟')){
